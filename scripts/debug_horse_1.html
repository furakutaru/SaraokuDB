<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>テスト馬1 - サラブレッドオークション</title>
</head>
<body>
    <div class="horseInfo">
        <div class="horseInfo__name">テスト馬1</div>
        <div class="horseInfo__data">
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">性別</span>
                <span class="horseInfo__data__item__value">牡</span>
            </div>
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">年齢</span>
                <span class="horseInfo__data__item__value">3歳</span>
            </div>
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">父</span>
                <span class="horseInfo__data__item__value">テスト父</span>
            </div>
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">母</span>
                <span class="horseInfo__data__item__value">テスト母</span>
            </div>
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">母の父</span>
                <span class="horseInfo__data__item__value">テスト母父</span>
            </div>
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">生産者</span>
                <span class="horseInfo__data__item__value">テスト牧場</span>
            </div>
            <div class="horseInfo__data__item">
                <span class="horseInfo__data__item__title">セリ取引価格</span>
                <span class="horseInfo__data__item__value">500.0万円</span>
            </div>
        </div>
    </div>
    
    <div class="horseComment">
        <h3>コメント</h3>
        <div class="horseComment__content">
            <pre style="white-space: pre-wrap;">テスト用のコメントです。この馬はテスト用に作成された架空の馬です。</pre>
        </div>
    </div>
    
    <div class="raceRecord">
        <h3>戦績</h3>
        <table class="raceRecord__table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>レース名</th>
                    <th>頭数</th>
                    <th>着順</th>
                    <th>賞金(万円)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2025/07/15</td>
                    <td>テスト競馬場 テストレース</td>
                    <td>10</td>
                    <td>1</td>
                    <td>500.0</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
