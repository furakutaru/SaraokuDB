<!DOCTYPE html>
<html>
<head>
    <title>テスト馬詳細</title>
    <meta charset="UTF-8">
</head>
<body>
    <div class="horse-detail">
        <h1 class="horse-name">テストホース</h1>
        
        <div class="horse-info">
            <div class="info-row">
                <span class="info-label">性別:</span>
                <span class="info-value">牡</span>
            </div>
            <div class="info-row">
                <span class="info-label">年齢:</span>
                <span class="info-value">3歳</span>
            </div>
        </div>
        
        <div class="pedigree-section">
            <h2>血統情報</h2>
            <div class="pedigree-info">
                <p>父：テストサイアー</p>
                <p>母：テストダム</p>
                <p>母の父：テストダムサイアー</p>
            </div>
            
            <!-- Alternative format that might appear on the page -->
            <div class="pedigree-table" style="display: none;">
                <table>
                    <tr>
                        <th>父</th>
                        <td>テストサイアー</td>
                    </tr>
                    <tr>
                        <th>母</th>
                        <td>テストダム</td>
                    </tr>
                    <tr>
                        <th>母の父</th>
                        <td>テストダムサイアー</td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div class="other-info">
            <h3>その他の情報</h3>
            <p>馬体重: 450kg</p>
            <p>総賞金: 1,234.5万円</p>
        </div>
    </div>
</body>
</html>
