name: Scrape and Update Database

on:
  schedule:
    - cron: '59 14 * * 4,0'  # 毎週木曜・日曜 23:59 JST (UTC+9)
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限
  pull-requests: write  # PR作成用

jobs:
  scrape-and-update:
    name: Scrape and Update Database
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG
      GITHUB_ACTIONS: "true"
      PYTHONUNBUFFERED: 1
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴を取得
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          # jqをインストール
          echo "Installing jq..."
          sudo apt-get update
          sudo apt-get install -y jq curl
          
          # jqのパスを確認
          echo "Checking jq installation..."
          which jq || echo "jq not found in PATH"
          jq --version || echo "jq version check failed"
          
          # パスを確認
          echo "PATH: $PATH"
          echo "jq path: $(which jq)"
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install requests beautifulsoup4 lxml tqdm sqlalchemy python-dotenv aiohttp
          
      - name: Set up database directory
        run: |
          mkdir -p backend/data
          touch backend/data/horses.db
          
      - name: Set up authentication and environment
        id: auth
        continue-on-error: false
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "::group::🔐 認証処理を開始します"
          
          # 認証トークンを取得
          echo "::notice:: 認証を試みます: $PROD_API_BASE_URL/auth/token"
          
          AUTH_RESPONSE=$(curl -s -v -X POST "$PROD_API_BASE_URL/auth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=$PROD_API_USERNAME" \
            -d "password=$PROD_API_PASSWORD" \
            -w "\n%{http_code}" 2>&1 || echo "Curl failed")
            
          # レスポンスからステータスコードとコンテンツを分離
          HTTP_STATUS=$(echo "$AUTH_RESPONSE" | tail -n1)
          AUTH_CONTENT=$(echo "$AUTH_RESPONSE" | head -n -1)
          
          echo "::debug::認証レスポンス: $AUTH_CONTENT"
          echo "::debug::HTTPステータス: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::❌ 認証に失敗しました (ステータスコード: $HTTP_STATUS)"
            echo "::error::レスポンス: $AUTH_CONTENT"
            exit 1
          fi
          
          # トークンを抽出
          TOKEN=$(echo "$AUTH_CONTENT" | jq -r '.access_token' 2>/dev/null || \
                  echo "$AUTH_CONTENT" | grep -o '"access_token":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::❌ トークンの抽出に失敗しました"
            echo "::error::レスポンス: $AUTH_CONTENT"
            exit 1
          fi
          
          echo "::notice::✅ 認証に成功しました"
          
          # 環境変数に設定
          {
            echo "TOKEN=$TOKEN"
            echo "AUTH_HEADER=Bearer $TOKEN"
            echo "DATABASE_URL=sqlite:///$(pwd)/backend/data/horses.db"
            echo "LOG_LEVEL=DEBUG"
            echo "GITHUB_ACTIONS=true"
            echo "SECRET_KEY=$SECRET_KEY"
            echo "PROD_API_BASE_URL=$PROD_API_BASE_URL"
          } >> $GITHUB_ENV
          
          echo "::group::🔄 環境変数の確認"
          echo "TOKEN: ${TOKEN:0:10}..."
          echo "AUTH_HEADER: Bearer ${TOKEN:0:10}..."
          echo "DATABASE_URL: sqlite:///$(pwd)/backend/data/horses.db"
          echo "LOG_LEVEL: DEBUG"
          echo "GITHUB_ACTIONS: true"
          echo "PROD_API_BASE_URL: $PROD_API_BASE_URL"
          echo "::endgroup::"
          
          # スクレイピング用のディレクトリ作成
          mkdir -p logs
          mkdir -p cache
          
          echo "::notice::✅ 環境設定が完了しました"
          echo "::endgroup::"
          
          # 明示的に正常終了
          exit 0
          
      - name: Verify environment
        run: |
          echo "PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL != '' && '***' || 'Not Set' }}"
          echo "AUTH_TOKEN: ${{ env.TOKEN != '' && '***' || 'Not Set' }}"
          
      - name: Run scraper with debug
        env:
          AUTH_TOKEN: ${{ env.TOKEN }}
          AUTH_HEADER: ${{ env.AUTH_HEADER }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          GITHUB_ACTIONS: true
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          set -e  # エラーが発生したらスクリプトを終了
          
          # タイムスタンプを取得
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          LOG_FILE="logs/scraper_${TIMESTAMP}.log"
          
          # データベースの初期化
          echo "::group::💾 データベースを初期化しています..."
          cd backend
          python -c "
          from database.models import Base, engine
          import logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          logger.info('データベーステーブルを作成します...')
          Base.metadata.create_all(bind=engine)
          logger.info('データベーステーブルの作成が完了しました')
          " 2>&1 | tee -a "../$LOG_FILE"
          
          # 出力ディレクトリの作成
          echo "::group::📁 出力ディレクトリを準備しています..."
          mkdir -p ../static-frontend/public/data
          
          # スクリプトのパスを確認
          SCRIPT_PATH="../scripts/scrape_and_save.py"
          echo "::notice::スクリプトパス: $SCRIPT_PATH"
          
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::❌ スクリプトが見つかりません: $SCRIPT_PATH"
            echo "現在のディレクトリ: $(pwd)"
            ls -la ../scripts/
            exit 1
          fi
          
          # 環境変数をエクスポート
          export AUTH_TOKEN="$AUTH_TOKEN"
          export AUTH_HEADER="$AUTH_HEADER"
          export PROD_API_BASE_URL="$PROD_API_BASE_URL"
          export DATABASE_URL="$DATABASE_URL"
          export LOG_LEVEL="$LOG_LEVEL"
          export GITHUB_ACTIONS="true"
          export SECRET_KEY="$SECRET_KEY"
          
          # スクリプトを実行（タイムアウトとリトライ付き）
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "::notice:: スクレイピングを試行中 (試行 $ATTEMPT/$MAX_ATTEMPTS)"
            
            # スクリプトを実行（タイムアウト: 30分）
            cd "$(dirname "$SCRIPT_PATH")"
            timeout 1800 python -u "$(basename "$SCRIPT_PATH")" 2>&1 | tee -a "../../$LOG_FILE"
            EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $EXIT_CODE -eq 0 ]; then
              SUCCESS=true
              echo "::notice::✅ スクレイピングが正常に完了しました"
              break
            elif [ $EXIT_CODE -eq 124 ]; then
              echo "::warning::⚠️ スクレイピングがタイムアウトしました (30分経過)"
            else
              echo "::warning::⚠️ スクレイピングがエラーで終了しました (終了コード: $EXIT_CODE)"
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              RETRY_DELAY=$((ATTEMPT * 60))
              echo "::notice::⏳ $RETRY_DELAY秒後に再試行します..."
              sleep $RETRY_DELAY
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "::error::❌ スクレイピングが $MAX_ATTEMPTS 回失敗しました。処理を中止します。"
            exit 1
          fi
          
          # 出力ファイルの確認
          if [ ! -f "output.json" ]; then
            echo "::error::❌ 出力ファイルが生成されていません"
            exit 1
          fi
          
          # データのバリデーション
          echo "::group::🔍 データを検証しています..."
          if ! jq empty output.json 2>/dev/null; then
            echo "::error::❌ 出力ファイルが有効なJSON形式ではありません"
            exit 1
          fi
          
          # データのサイズをチェック
          FILESIZE=$(wc -c <"output.json")
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::❌ 出力ファイルのサイズが小さすぎます (${FILESIZE}バイト)"
            exit 1
          fi
          
          echo "✅ データの検証が完了しました (サイズ: ${FILESIZE}バイト)"
          
          # データベースのバックアップ
          echo "::group::💾 データベースをバックアップしています..."
          cd ..
          if [ -f "backend/data/horses.db" ]; then
            cp "backend/data/horses.db" "backend/data/horses_${TIMESTAMP}.db"
            echo "✅ データベースをバックアップしました: backend/data/horses_${TIMESTAMP}.db"
          fi
          
          # ログをアップロード用に保存
          echo "::notice::📝 ログファイル: $LOG_FILE"
          
          echo "::notice::✨ スクレイピング処理が正常に完了しました"
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージング
          git add .
          
          # 変更を確認
          git status
          
          # 変更をコミット（変更がない場合はスキップ）
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update horse data [skip ci]"
            
            # 変更をプッシュ（リトライ付き）
            for i in 1 2 3; do
              if git push; then
                echo "Push successful"
                exit 0
              else
                echo "Push failed, retrying..."
                git pull --rebase
                sleep 5
              fi
            done
            echo "All push attempts failed"
            exit 1
          else
            echo "No changes to commit"
          fi
