name: Scrape and Update Database

on:
  schedule:
    - cron: '59 14 * * 4,0'  # 毎週木曜・日曜 23:59 JST (UTC+9)
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限

jobs:
  scrape-and-update:
    name: Scrape and Update Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests beautifulsoup4 lxml tqdm sqlalchemy python-dotenv aiohttp
          
      - name: Set up database directory
        run: |
          mkdir -p backend/data
          touch backend/data/horses.db
          
      - name: Set environment variables
        run: |
          echo "DATABASE_URL=sqlite:///$(pwd)/backend/data/horses.db" >> $GITHUB_ENV
          echo "PROD_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}" >> $GITHUB_ENV
          echo "PROD_API_USERNAME=${{ secrets.PROD_API_USERNAME }}" >> $GITHUB_ENV
          echo "PROD_API_PASSWORD=${{ secrets.PROD_API_PASSWORD }}" >> $GITHUB_ENV
          # セキュリティのため、機密情報をマスク
          echo "::add-mask::${{ secrets.PROD_API_PASSWORD }}"
          
      - name: Run scraper
        run: |
          # データベースの初期化
          cd backend
          python -c "from database.models import Base, engine; Base.metadata.create_all(bind=engine)"
          
          # 出力ディレクトリの作成
          mkdir -p ../static-frontend/public/data
          
          # スクレイパーの実行
          cd ../scripts
          python scrape_and_save.py
          
          # データベースのバックアップ
          cd ..
          cp backend/data/horses.db backend/data/horses_$(date +%Y%m%d_%H%M%S).db
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージング
          git add .
          
          # 変更を確認
          git status
          
          # 変更をコミット（変更がない場合はスキップ）
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update horse data [skip ci]"
            
            # 変更をプッシュ（リトライ付き）
            for i in 1 2 3; do
              if git push; then
                echo "Push successful"
                exit 0
              else
                echo "Push failed, retrying..."
                git pull --rebase
                sleep 5
              fi
            done
            echo "All push attempts failed"
            exit 1
          else
            echo "No changes to commit"
          fi
