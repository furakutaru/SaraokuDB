name: Scrape and Update Database

on:
  schedule:
    - cron: '59 14 * * 4,0'  # 毎週木曜・日曜 23:59 JST (UTC+9)
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限

jobs:
  scrape-and-update:
    name: Scrape and Update Database
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG
      GITHUB_ACTIONS: "true"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq  # JSON処理用
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests beautifulsoup4 lxml tqdm sqlalchemy python-dotenv aiohttp
          
      - name: Set up database directory
        run: |
          mkdir -p backend/data
          touch backend/data/horses.db
          
      - name: Set up authentication and environment
        id: auth
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL || 'http://localhost:8001' }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME || 'testuser' }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD || 'testpass' }}
        run: |
          echo "::group::🔐 認証情報を設定中..."
          echo "API Base URL: ${PROD_API_BASE_URL}"
          
          # 認証トークンを取得
          echo "::group::🔑 認証トークンを取得中..."
          echo "リクエスト先: $PROD_API_BASE_URL/api/auth/token"
          AUTH_RESPONSE=$(curl -v -X POST "$PROD_API_BASE_URL/api/auth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=$PROD_API_USERNAME" \
            -d "password=$PROD_API_PASSWORD" \
            -w "\n%{http_code}" 2>&1 || echo "Curl failed")
          
          # レスポンスからステータスコードとコンテンツを分離
          HTTP_STATUS=$(echo "$AUTH_RESPONSE" | tail -n1)
          AUTH_CONTENT=$(echo "$AUTH_RESPONSE" | head -n -1 | jq -r '.' 2>/dev/null || echo "$AUTH_RESPONSE" | head -n -1)
          
          # デバッグ情報を出力
          echo "::debug::認証レスポンス: $AUTH_RESPONSE"
          echo "::debug::ステータスコード: $HTTP_STATUS"
          echo "::debug::レスポンス本文: $AUTH_CONTENT"
          
          # エラーチェック
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::❌ 認証に失敗しました。ステータスコード: $HTTP_STATUS"
            echo "::error::レスポンス: $AUTH_CONTENT"
            exit 1
          fi
          
          # トークンを抽出
          TOKEN=$(echo "$AUTH_CONTENT" | jq -r '.access_token' 2>/dev/null)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::❌ トークンの抽出に失敗しました"
            echo "::error::レスポンス: $AUTH_CONTENT"
            exit 1
          fi
          
          # 環境変数に設定
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AUTH_HEADER=Bearer $TOKEN" >> $GITHUB_ENV
          
          # 保護されたエンドポイントでトークンを検証
          echo "::group::🔍 トークンを検証中..."
          echo "リクエスト先: $PROD_API_BASE_URL/api/users/me"
          USER_INFO=$(curl -v -X GET "$PROD_API_BASE_URL/api/users/me" \
            -H "Authorization: Bearer $TOKEN" \
            -w "\n%{http_code}" 2>&1)
          
          USER_HTTP_STATUS=$(echo "$USER_INFO" | tail -n1)
          USER_CONTENT=$(echo "$USER_INFO" | head -n -1 | jq -r '.' 2>/dev/null || echo "$USER_INFO" | head -n -1)
          
          if [ "$USER_HTTP_STATUS" = "200" ]; then
            echo "✅ 認証に成功しました"
            echo "::debug::ユーザー情報: $USER_CONTENT"
          else
            echo "::error::❌ トークンの検証に失敗しました。ステータスコード: $USER_HTTP_STATUS"
            echo "::error::レスポンス: $USER_CONTENT"
            exit 1
          fi
          
          echo "::group::"  # グループを閉じる
          # 基本環境変数の設定
          echo "DATABASE_URL=sqlite:///$(pwd)/backend/data/horses.db" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
          echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV
          
      - name: Verify environment
        run: |
          echo "PROD_API_BASE_URL: ${{ env.PROD_API_BASE_URL != '' && '***' || 'Not Set' }}"
          echo "AUTH_TOKEN: ${{ env.AUTH_TOKEN != '' && '***' || 'Not Set' }}"
          
      - name: Run scraper with debug
        env:
          AUTH_TOKEN: ${{ env.AUTH_TOKEN }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          set -e  # エラーが発生したらスクリプトを終了
          
          # データベースの初期化
          echo "::group::💾 データベースを初期化しています..."
          cd backend
          python -c "from database.models import Base, engine; Base.metadata.create_all(bind=engine)"
          
          # 出力ディレクトリの作成
          echo "::group::📁 出力ディレクトリを準備しています..."
          mkdir -p ../static-frontend/public/data
          
          # スクレイパーの実行
          echo "::group::🔄 スクレイパーを実行しています..."
          cd ../scripts
          
          # スクリプトを実行
          if ! python scrape_and_save.py; then
            echo "::error::❌ スクレイピングスクリプトがエラーで終了しました"
            exit 1
          fi
          
          # 出力ファイルの確認
          if [ ! -f "output.json" ]; then
            echo "::error::❌ 出力ファイルが生成されていません"
            exit 1
          fi
          
          # ログとバックアップ
          echo "::group::💾 ログとバックアップを保存しています..."
          mkdir -p ../logs
          if [ -f scraper.log ]; then
            cp scraper.log "../logs/scraper_$(date +%Y%m%d_%H%M%S).log"
          fi
          
          cd ..
          if [ -f backend/data/horses.db ]; then
            cp backend/data/horses.db "backend/data/horses_$(date +%Y%m%d_%H%M%S).db"
          fi
          
          echo "✅ スクレイピングが正常に完了しました"
          echo "::group::"
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-files
          path: |
            ./scripts/output.json
            ./backend/data/horses.db
            ./logs/*.log
          retention-days: 5
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージング
          git add .
          
          # 変更を確認
          git status
          
          # 変更をコミット（変更がない場合はスキップ）
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update horse data [skip ci]"
            
            # 変更をプッシュ（リトライ付き）
            for i in 1 2 3; do
              if git push; then
                echo "Push successful"
                exit 0
              else
                echo "Push failed, retrying..."
                git pull --rebase
                sleep 5
              fi
            done
            echo "All push attempts failed"
            exit 1
          else
            echo "No changes to commit"
          fi
