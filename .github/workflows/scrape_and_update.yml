name: Scrape and Update Database

on:
  schedule:
    - cron: '59 14 * * 4,0'  # 毎週木曜・日曜 23:59 JST (UTC+9)
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限
  pull-requests: write  # PR作成用

jobs:
  scrape-and-update:
    name: Scrape and Update Database
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG
      GITHUB_ACTIONS: "true"
      PYTHONUNBUFFERED: 1
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴を取得
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          # 必要なパッケージをインストール
          echo "Installing required packages..."
          sudo apt-get update
          sudo apt-get install -y jq curl sqlite3
          
          # インストールの確認
          echo "Checking installations..."
          which jq || echo "jq not found in PATH"
          jq --version || echo "jq version check failed"
          which sqlite3 || echo "sqlite3 not found in PATH"
          sqlite3 --version || echo "sqlite3 version check failed"
          
          # パスを確認
          echo "PATH: $PATH"
          echo "jq path: $(which jq)"
          echo "sqlite3 path: $(which sqlite3)"
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install requests beautifulsoup4 lxml tqdm sqlalchemy python-dotenv aiohttp
          
      - name: Set up database directory
        run: |
          mkdir -p backend/data
          touch backend/data/horses.db
          
      - name: Set up authentication and environment
        id: auth
        continue-on-error: false
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ACTIONS_STEP_DEBUG: true  # デバッグログを有効化
          ACTIONS_RUNNER_DEBUG: true  # デバッグログを有効化
        run: |
          # デバッグ情報を有効化
          set -x  # コマンドのトレースを有効化
          
          # デバッグ用に環境変数をログに出力（機密情報はマスク）
          echo "::group::🔍 環境変数の確認"
          echo "PROD_API_BASE_URL: ${PROD_API_BASE_URL:0:10}..."
          echo "PROD_API_USERNAME: ${PROD_API_USERNAME:0:3}..."
          echo "PROD_API_PASSWORD: ${PROD_API_PASSWORD:0:3}..."
          echo "SECRET_KEY: ${SECRET_KEY:0:5}..."
          echo "::endgroup::"
          
          echo "::group::🔐 認証処理を開始します"
          
          # 一時ファイルを作成
          TEMP_FILE=$(mktemp)
          echo "::debug::一時ファイルを作成しました: $TEMP_FILE"
          echo "TEMP_FILE: $TEMP_FILE" >&2
          
          # 認証URLを設定
          AUTH_URL="$PROD_API_BASE_URL/api/auth/token"
          echo "::notice:: 認証を試みます: $AUTH_URL"
          
          # リクエストボディを変数に格納（デバッグ用）
          REQUEST_BODY="username=$PROD_API_USERNAME&password=${PROD_API_PASSWORD:0:3}..."
          echo "::debug::リクエストボディ: $REQUEST_BODY"
          
          # 認証リクエストを実行
          HTTP_RESPONSE=$(curl -v -s -w "\n%{http_code}" \
            -X POST "$AUTH_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=$PROD_API_USERNAME" \
            -d "password=$PROD_API_PASSWORD" 2> "${TEMP_FILE}_curl.log" || echo "CURL_ERROR")
          
          # ステータスコードとレスポンスを抽出
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          AUTH_CONTENT=$(echo "$HTTP_RESPONSE" | head -n -1)
          
          # デバッグ情報を出力
          echo "::debug::HTTPステータス: $HTTP_STATUS"
          echo "::debug::cURLログ: $(cat "${TEMP_FILE}_curl.log")"
          echo "::debug::レスポンス: $AUTH_CONTENT"
          
          # 一時ファイルに出力（エラー処理用）
          echo "$AUTH_CONTENT" > "$TEMP_FILE"
            
          # ステータスコードが空でないか確認
          if [ -z "$HTTP_STATUS" ]; then
            echo "::error::❌ 認証レスポンスが空です"
            echo "::error::レスポンス全体: $(cat "$TEMP_FILE")"
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          # ステータスコードが数値か確認
          if ! [[ "$HTTP_STATUS" =~ ^[0-9]+$ ]]; then
            echo "::error::❌ 無効なHTTPステータスコード: $HTTP_STATUS"
            echo "::error::レスポンス全体: $AUTH_CONTENT"
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          # ステータスコードを確認
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::❌ 認証に失敗しました (ステータスコード: $HTTP_STATUS)"
            echo "::error::レスポンス: $AUTH_CONTENT"
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          echo "::notice::✅ 認証リクエストは成功しました (ステータスコード: $HTTP_STATUS)"
          
          # トークンを抽出
          TOKEN=$(echo "$AUTH_CONTENT" | jq -r '.access_token' 2>/dev/null || \
                  echo "$AUTH_CONTENT" | grep -o '"access_token":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::❌ トークンの抽出に失敗しました"
            echo "::error::レスポンス: $AUTH_CONTENT"
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          echo "::notice::✅ 認証に成功しました"
          
          # 環境変数に設定（デバッグ用に各ステップを分離）
          echo "TOKEN=$TOKEN" | tee -a $GITHUB_ENV
          echo "TOKEN を設定しました: ${TOKEN:0:10}..." >&2
          
          echo "AUTH_HEADER=Bearer $TOKEN" | tee -a $GITHUB_ENV
          echo "AUTH_HEADER を設定しました" >&2
          
          echo "DATABASE_URL=sqlite:///$(pwd)/backend/data/horses.db" | tee -a $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" | tee -a $GITHUB_ENV
          echo "GITHUB_ACTIONS=true" | tee -a $GITHUB_ENV
          echo "SECRET_KEY=$SECRET_KEY" | tee -a $GITHUB_ENV
          echo "PROD_API_BASE_URL=$PROD_API_BASE_URL" | tee -a $GITHUB_ENV
          
          # 環境変数が正しく設定されたか確認
          echo "環境変数の設定を確認中..." >&2
          if [ -f "$GITHUB_ENV" ]; then
            echo "GITHUB_ENV ファイルの内容:" >&2
            cat "$GITHUB_ENV" | sed 's/TOKEN=.*/TOKEN=***/' | sed 's/SECRET_KEY=.*/SECRET_KEY=***/' >&2
          else
            echo "::error::GITHUB_ENV ファイルが見つかりません: $GITHUB_ENV" >&2
            exit 1
          fi
          
          # 環境変数の確認
          echo "::group::🔄 環境変数の確認"
          echo "TOKEN: ${TOKEN:0:10}..."
          echo "AUTH_HEADER: Bearer ${TOKEN:0:10}..."
          echo "DATABASE_URL: sqlite:///$(pwd)/backend/data/horses.db"
          echo "LOG_LEVEL: DEBUG"
          echo "GITHUB_ACTIONS: true"
          echo "PROD_API_BASE_URL: $PROD_API_BASE_URL"
          echo "::endgroup::"
          
          # 一時ファイルを削除
          rm -f "$TEMP_FILE"
          
          # スクレイピング用のディレクトリ作成
          mkdir -p logs
          mkdir -p cache
          
          echo "::notice::✅ 環境設定が完了しました"
          echo "::endgroup::"
          
          # 環境変数が正しく設定されたことを確認
          if [ -z "$TOKEN" ]; then
            echo "::error::❌ 環境変数の設定に失敗しました" >&2
            echo "TOKEN が空です" >&2
            exit 1
          fi
          
          # 環境変数の確認
          echo "::group::✅ 最終的な環境変数の確認"
          env | grep -E 'TOKEN|AUTH_|DATABASE_URL|LOG_LEVEL|GITHUB_|SECRET_KEY|PROD_API_' | \
            sed 's/TOKEN=.*/TOKEN=***/' | \
            sed 's/SECRET_KEY=.*/SECRET_KEY=***/' | \
            sed 's/PROD_API_PASSWORD=.*/PROD_API_PASSWORD=***/'
          echo "::endgroup::"
          
          # 正常終了
          echo "::notice::✅ 認証処理が正常に完了しました"
          echo "スクリプトを正常に終了します" >&2
          exit 0
          
      - name: Verify environment
        run: |
          echo "PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL != '' && '***' || 'Not Set' }}"
          if [ -n "$TOKEN" ]; then
            echo "AUTH_TOKEN: ***"
          else
            echo "AUTH_TOKEN: Not Set"
          fi
          
      - name: Run scraper with debug
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          AUTH_HEADER: ${{ steps.auth.outputs.auth_header }}
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_BASE_URL }}
          LOG_LEVEL: DEBUG
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: 1
          PYTHONPATH: ${{ github.workspace }}
          SQLITE_DB_DIR: ${{ github.workspace }}/backend/data
          # SQLiteの設定
          SQLITE_TIMEOUT: 30
          SQLITE_JOURNAL_MODE: WAL  # Write-Ahead Logging モードを使用
        run: |
          set -e  # エラーが発生したらスクリプトを終了
          
          # タイムスタンプを取得
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          LOG_DIR="logs"
          LOG_FILE="$LOG_DIR/scraper_${TIMESTAMP}.log"
          
          # ログディレクトリが存在しない場合は作成
          mkdir -p "$LOG_DIR"
          
          # 環境情報をログに記録
          echo "===== Environment Information =====" | tee -a "$LOG_FILE"
          echo "Current directory: $(pwd)" | tee -a "$LOG_FILE"
          echo "Python version: $(python --version 2>&1)" | tee -a "$LOG_FILE"
          echo "Pip version: $(pip --version 2>&1)" | tee -a "$LOG_FILE"
          echo "SQLite version: $(sqlite3 --version 2>&1)" | tee -a "$LOG_FILE"
          echo "Environment variables:" | tee -a "$LOG_FILE"
          env | sort | tee -a "$LOG_FILE"
          echo "==================================" | tee -a "$LOG_FILE"
          
          # データベースディレクトリの確認
          echo "Checking database directory..." | tee -a "$LOG_FILE"
          ls -la "$SQLITE_DB_DIR" 2>&1 | tee -a "$LOG_FILE" || true
          
          # データベースファイルの確認
          DB_FILE="$SQLITE_DB_DIR/horses.db"
          if [ -f "$DB_FILE" ]; then
            echo "Database file exists: $DB_FILE" | tee -a "$LOG_FILE"
            echo "Database file size: $(du -h "$DB_FILE" | cut -f1)" | tee -a "$LOG_FILE"
            echo "Database file permissions: $(stat -c "%a %n" "$DB_FILE" 2>&1)" | tee -a "$LOG_FILE"
            
            # データベースの整合性チェック
            echo "Checking database integrity..." | tee -a "$LOG_FILE"
            sqlite3 "$DB_FILE" "PRAGMA integrity_check;" 2>&1 | tee -a "$LOG_FILE" || true
            
            # データベースの統計情報を表示
            echo "Database statistics:" | tee -a "$LOG_FILE"
            sqlite3 "$DB_FILE" ".tables" 2>&1 | tee -a "$LOG_FILE"
            sqlite3 "$DB_FILE" "SELECT name FROM sqlite_master WHERE type='table';" 2>&1 | tee -a "$LOG_FILE"
          else
            echo "Database file does not exist: $DB_FILE" | tee -a "$LOG_FILE"
          fi
          
          # データベースの初期化
          echo "::group::💾 データベースを初期化しています..."
          cd backend
          python -c "
          from database.models import Base, engine
          import logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          logger.info('データベーステーブルを作成します...')
          Base.metadata.create_all(bind=engine)
          logger.info('データベーステーブルの作成が完了しました')
          " 2>&1 | tee -a "../$LOG_FILE"
          
          # 出力ディレクトリの作成
          echo "::group::📁 出力ディレクトリを準備しています..."
          mkdir -p ../static-frontend/public/data
          
          # スクリプトのパスを確認
          SCRIPT_PATH="../scripts/scrape_and_save.py"
          echo "::notice::スクリプトパス: $SCRIPT_PATH"
          
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::❌ スクリプトが見つかりません: $SCRIPT_PATH"
            echo "現在のディレクトリ: $(pwd)"
            ls -la ../scripts/
            exit 1
          fi
          
          # 環境変数をエクスポート
          export AUTH_TOKEN="$AUTH_TOKEN"
          export AUTH_HEADER="$AUTH_HEADER"
          export PROD_API_BASE_URL="$PROD_API_BASE_URL"
          export DATABASE_URL="$DATABASE_URL"
          export LOG_LEVEL="$LOG_LEVEL"
          export GITHUB_ACTIONS="true"
          export SECRET_KEY="$SECRET_KEY"
          
          # スクリプトを実行（タイムアウトとリトライ付き）
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          
          # スクリプトのディレクトリに移動
          SCRIPT_DIR="$(dirname "$SCRIPT_PATH")"
          SCRIPT_NAME="$(basename "$SCRIPT_PATH")"
          
          # 出力ディレクトリを絶対パスで設定
          OUTPUT_DIR="$GITHUB_WORKSPACE/static-frontend/public/data"
          mkdir -p "$OUTPUT_DIR"
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "::notice:: スクレイピングを試行中 (試行 $ATTEMPT/$MAX_ATTEMPTS)"
            
            # スクリプトを実行（タイムアウト: 30分）
            cd "$SCRIPT_DIR"
            
            # 現在のディレクトリとファイルを確認
            echo "::group::📂 現在のディレクトリとファイル"
            pwd
            ls -la
            echo "::endgroup::"
            
            # スクリプトを実行
            echo "::notice::スクリプトを実行します: $SCRIPT_NAME"
            echo "::notice::出力ディレクトリ: $OUTPUT_DIR"
            
            # 出力ディレクトリの確認
            echo "::group::📂 出力ディレクトリの確認"
            ls -la "$OUTPUT_DIR" || echo "出力ディレクトリが存在しません"
            echo "::endgroup::"
            
            # スクリプトを実行（絶対パスで指定）
            cd "$SCRIPT_DIR"
            python -u "$SCRIPT_NAME" --output-dir "$OUTPUT_DIR" 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_FILE"
            EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $EXIT_CODE -eq 0 ]; then
              # 出力ファイルを確認
              OUTPUT_FILE="$OUTPUT_DIR/horses.json"
              if [ -f "$OUTPUT_FILE" ]; then
                FILESIZE=$(wc -c <"$OUTPUT_FILE")
                if [ "$FILESIZE" -gt 100 ]; then
                  SUCCESS=true
                  echo "::notice::✅ スクレイピングが正常に完了しました (出力ファイル: $OUTPUT_FILE, サイズ: ${FILESIZE}バイト)"
                  break
                else
                  echo "::warning::⚠️ 出力ファイルのサイズが小さすぎます (${FILESIZE}バイト)"
                fi
              else
                echo "::warning::⚠️ 出力ファイルが見つかりません: $OUTPUT_FILE"
              fi
            elif [ $EXIT_CODE -eq 124 ]; then
              echo "::warning::⚠️ スクレイピングがタイムアウトしました (30分経過)"
            else
              echo "::warning::⚠️ スクレイピングがエラーで終了しました (終了コード: $EXIT_CODE)"
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              RETRY_DELAY=$((ATTEMPT * 60))
              echo "::notice::⏳ $RETRY_DELAY秒後に再試行します..."
              sleep $RETRY_DELAY
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "::error::❌ スクレイピングが $MAX_ATTEMPTS 回失敗しました。処理を中止します。"
            
            # エラー時のデバッグ情報を出力
            echo "::group::🐛 デバッグ情報"
            echo "現在のディレクトリ: $(pwd)"
            echo "スクリプトの場所: $SCRIPT_DIR/$SCRIPT_NAME"
            echo "出力ディレクトリ: $OUTPUT_DIR"
            echo "ディレクトリの内容:"
            ls -la "$OUTPUT_DIR"
            
            # ログの最後の100行を表示
            echo "\nログの最後の100行:"
            tail -n 100 "$GITHUB_WORKSPACE/$LOG_FILE" || echo "ログファイルが見つかりません"
            echo "::endgroup::"
            
            exit 1
          fi
          
          # データのバリデーション
          echo "::group::🔍 データを検証しています..."
          if ! jq empty output.json 2>/dev/null; then
            echo "::error::❌ 出力ファイルが有効なJSON形式ではありません"
            exit 1
          fi
          
          # データのサイズをチェック
          FILESIZE=$(wc -c <"output.json")
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::❌ 出力ファイルのサイズが小さすぎます (${FILESIZE}バイト)"
            exit 1
          fi
          
          echo "✅ データの検証が完了しました (サイズ: ${FILESIZE}バイト)"
          
          # データベースのバックアップ
          echo "::group::💾 データベースをバックアップしています..."
          cd ..
          if [ -f "backend/data/horses.db" ]; then
            cp "backend/data/horses.db" "backend/data/horses_${TIMESTAMP}.db"
            echo "✅ データベースをバックアップしました: backend/data/horses_${TIMESTAMP}.db"
          fi
          
          # ログをアップロード用に保存
          echo "::notice::📝 ログファイル: $LOG_FILE"
          
          echo "::notice::✨ スクレイピング処理が正常に完了しました"
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージング
          git add .
          
          # 変更を確認
          git status
          
          # 変更をコミット（変更がない場合はスキップ）
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update horse data [skip ci]"
            
            # 変更をプッシュ（リトライ付き）
            for i in 1 2 3; do
              if git push; then
                echo "Push successful"
                exit 0
              else
                echo "Push failed, retrying..."
                git pull --rebase
                sleep 5
              fi
            done
            echo "All push attempts failed"
            exit 1
          else
            echo "No changes to commit"
          fi
