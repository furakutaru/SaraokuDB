name: Scrape and Update Database

on:
  schedule:
    - cron: '59 14 * * 4,0'  # 毎週木曜・日曜 23:59 JST (UTC+9)
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限

jobs:
  scrape-and-update:
    name: Scrape and Update Database
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG
      GITHUB_ACTIONS: "true"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests beautifulsoup4 lxml tqdm sqlalchemy python-dotenv aiohttp
          
      - name: Set up database directory
        run: |
          mkdir -p backend/data
          touch backend/data/horses.db
          
      - name: Set environment variables
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD }}
        run: |
          echo "DATABASE_URL=sqlite:///$(pwd)/backend/data/horses.db" >> $GITHUB_ENV
          echo "PROD_API_BASE_URL=$PROD_API_BASE_URL" >> $GITHUB_ENV
          echo "PROD_API_USERNAME=$PROD_API_USERNAME" >> $GITHUB_ENV
          echo "PROD_API_PASSWORD=$PROD_API_PASSWORD" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
          echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV
          
      - name: Verify environment variables
        run: |
          echo "PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL != '' && '***' || 'Not Set' }}"
          echo "PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME != '' && '***' || 'Not Set' }}"
          echo "PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD != '' && '***' || 'Not Set' }}"
          
      - name: Test API connection
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD }}
        run: |
          echo "Testing API connection..."
          # Vercelの設定に合わせて、/api プレフィックスを追加
          response=$(curl -v -s -o /dev/null -w "%{http_code}" -X POST \
            "$PROD_API_BASE_URL/api/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=$PROD_API_USERNAME" \
            -d "password=$PROD_API_PASSWORD")
            
          if [ "$response" != "200" ]; then
            echo "API接続テストに失敗しました。ステータスコード: $response"
            exit 1
          fi
          echo "API接続テストに成功しました"
          
      - name: Run scraper with debug
        run: |
          set -e  # エラーが発生したらスクリプトを終了
          
          # データベースの初期化
          echo "データベースを初期化しています..."
          cd backend
          python -c "from database.models import Base, engine; Base.metadata.create_all(bind=engine)"
          
          # 出力ディレクトリの作成
          echo "出力ディレクトリを作成しています..."
          mkdir -p ../static-frontend/public/data
          
          # スクレイパーの実行
          echo "スクレイパーを実行しています..."
          cd ../scripts
          
          # スクリプトを実行し、終了コードをチェック
          if ! python scrape_and_save.py; then
            echo "スクレイピングスクリプトがエラーで終了しました"
            exit 1
          fi
          
          # ログファイルをアーティファクトとして保存
          echo "ログファイルを保存しています..."
          mkdir -p ../logs
          if [ -f scraper.log ]; then
            cp scraper.log "../logs/scraper_$(date +%Y%m%d_%H%M%S).log"
          else
            echo "警告: ログファイルが見つかりませんでした"
          fi
          
          # データベースのバックアップ
          cd ..
          if [ -f backend/data/horses.db ]; then
            cp backend/data/horses.db "backend/data/horses_$(date +%Y%m%d_%H%M%S).db"
          else
            echo "警告: データベースファイルが見つかりませんでした"
          fi
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージング
          git add .
          
          # 変更を確認
          git status
          
          # 変更をコミット（変更がない場合はスキップ）
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update horse data [skip ci]"
            
            # 変更をプッシュ（リトライ付き）
            for i in 1 2 3; do
              if git push; then
                echo "Push successful"
                exit 0
              else
                echo "Push failed, retrying..."
                git pull --rebase
                sleep 5
              fi
            done
            echo "All push attempts failed"
            exit 1
          else
            echo "No changes to commit"
          fi