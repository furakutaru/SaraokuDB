name: Scrape and Update Database

on:
  schedule:
    - cron: '59 14 * * 4,0'  # 毎週木曜・日曜 23:59 JST (UTC+9)
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限

jobs:
  scrape-and-update:
    name: Scrape and Update Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests beautifulsoup4 lxml tqdm
          
      - name: Set environment variables
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "API_USERNAME=${{ secrets.API_USERNAME }}" >> $GITHUB_ENV
          echo "API_PASSWORD=${{ secrets.API_PASSWORD }}" >> $GITHUB_ENV
          # セキュリティのため、パスワードをマスク
          echo "::add-mask::${{ secrets.API_PASSWORD }}"
          
      - name: Run scraper
        run: |
          cd scripts
          python scrape_and_save.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージング
          git add .
          
          # 変更をコミット（変更がない場合はスキップ）
          git diff-index --quiet HEAD || git commit -m "Update horse data [skip ci]"
          
          # 変更をプッシュ（リトライ付き）
          for i in 1 2 3; do
            if git push; then
              echo "Push successful"
              exit 0
            else
              echo "Push failed, retrying..."
              git pull --rebase
              sleep 5
            fi
          done
          echo "All push attempts failed"
          exit 1
