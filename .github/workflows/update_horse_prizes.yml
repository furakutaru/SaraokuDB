name: Update Horse Prizes v2

on:
  schedule:
    - cron: '0 15 * * *'  # 毎日深夜0時（JST）に実行 = UTC15時
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write  # リポジトリへの書き込み権限
  pull-requests: write  # PR作成用

jobs:
  update-prizes:
    name: Update Horse Prizes
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG
      GITHUB_ACTIONS: "true"
      PYTHONUNBUFFERED: 1
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # 明示的にmainブランチを指定
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          echo "Installing required packages..."
          sudo apt-get update
          sudo apt-get install -y jq curl
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install aiohttp python-dotenv requests beautifulsoup4 lxml tqdm
          
      - name: Set up authentication and environment
        id: auth
        continue-on-error: false
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD }}
          # データベース接続情報
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -x
          
          echo "::group::🔍 環境変数の確認"
          echo "PROD_API_BASE_URL: ${PROD_API_BASE_URL:0:10}..."
          echo "PROD_API_USERNAME: ${PROD_API_USERNAME:0:3}..."
          echo "PROD_API_PASSWORD: ${PROD_API_PASSWORD:0:3}..."
          echo "::endgroup::"
          
          echo "::group::🔐 必要な環境変数の存在確認"
          
          if [ -z "$PROD_API_BASE_URL" ]; then
            echo "::error::PROD_API_BASE_URL が設定されていません"
            exit 1
          fi
          if [ -z "$PROD_API_USERNAME" ]; then
            echo "::error::PROD_API_USERNAME が設定されていません"
            exit 1
          fi
          if [ -z "$PROD_API_PASSWORD" ]; then
            echo "::error::PROD_API_PASSWORD が設定されていません"
            exit 1
          fi
          
          echo "::notice::必要な環境変数が全て設定されています"
          echo "::endgroup::"
          
          # Pythonスクリプト側で認証を行うためトークン取得はスキップ
          echo "token=skipped" >> $GITHUB_OUTPUT
          echo "auth_header=skipped" >> $GITHUB_OUTPUT

      - name: Set environment variables
        run: |
          # 環境変数を設定
          echo "TOKEN=${{ steps.auth.outputs.token }}" >> $GITHUB_ENV
          echo "AUTH_HEADER=${{ steps.auth.outputs.auth_header }}" >> $GITHUB_ENV
          
          # データベースURLを設定
          # PROD_API_BASE_URL から直接DATABASE_URLを構築
          DB_HOST=$(echo "${{ secrets.PROD_API_BASE_URL }}" | sed 's|^https\?://||')
          echo "DATABASE_URL=postgresql://$DB_HOST" >> $GITHUB_ENV
          
          # 更新間隔を設定
          echo "UPDATE_HORSE_PRIZES_INTERVAL_DAYS=${{ github.event.inputs.update_interval_days || '1' }}" >> $GITHUB_ENV
          
          # デバッグ用に環境変数をログに出力（機密情報はマスク）
          echo "::group::🔑 設定された環境変数"
          echo "TOKEN: ${TOKEN:0:5}..."
          echo "AUTH_HEADER: Bearer ${TOKEN:0:5}..."
          echo "DATABASE_URL: ${DATABASE_URL:0:20}..."
          echo "UPDATE_HORSE_PRIZES_INTERVAL_DAYS: ${UPDATE_HORSE_PRIZES_INTERVAL_DAYS}"
          echo "::endgroup::"

      - name: Debug - Show current code
        run: |
          echo "=== 現在のupdate_horse_prizes.pyの認証URL部分 ==="
          if [ -f "scripts/update_horse_prizes.py" ]; then
            grep -A 3 -B 3 "auth_url.*api/auth/token" scripts/update_horse_prizes.py || echo "パターンが見つかりません"
            echo "=== ファイルの先頭20行 ==="
            head -20 scripts/update_horse_prizes.py
          else
            echo "ファイルが見つかりません"
            ls -la scripts/
          fi
          echo "=========================================="

      - name: Force clean checkout
        run: |
          git clean -fd
          git reset --hard HEAD
          git status
          echo "=== リセット後の認証URL部分 ==="
          grep -A 3 -B 3 "auth_url.*api/auth/token" scripts/update_horse_prizes.py || echo "パターンが見つかりません"

      - name: Verify file content
        run: |
          echo "=== 実際のファイル内容を確認 ==="
          python3 -c "import re; content = open('scripts/update_horse_prizes.py').read(); matches = re.findall(r'auth_url.*api/auth/token', content); [print('Found: ' + match.strip()) for match in matches]"
          echo "=========================================="

      - name: Run update_horse_prizes.py
        if: always()  # 常に実行
        run: |
          set -e
          echo "Updating horse prizes..."
          echo "更新間隔: ${UPDATE_HORSE_PRIZES_INTERVAL_DAYS}日"
          
          # 実行前にファイル内容を確認
          echo "=== 実行前の最終確認 ==="
          grep -A 2 -B 2 "auth_url.*api/auth/token" scripts/update_horse_prizes.py || echo "パターンが見つかりません"
          echo "========================"
          
          python scripts/update_horse_prizes.py
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_API_USERNAME: ${{ secrets.PROD_API_USERNAME }}
          PROD_API_PASSWORD: ${{ secrets.PROD_API_PASSWORD }}
          TOKEN: ${{ env.TOKEN }}
          AUTH_HEADER: ${{ env.AUTH_HEADER }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          UPDATE_HORSE_PRIZES_INTERVAL_DAYS: ${{ env.UPDATE_HORSE_PRIZES_INTERVAL_DAYS }}
          LOG_LEVEL: DEBUG
          GITHUB_ACTIONS: "true"
          
      - name: Check for changes
        if: success()
        id: git-commit
        run: |
          if ! git diff --name-only --exit-code; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add .
            git commit -m "Update horse prize data"
            git push
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
