services:
  - type: web
    name: saraoku-db-api
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    # FastAPI を uvicorn で起動（Render の $PORT を使用）
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # 注意: この値はRenderダッシュボードで設定してください
        # ここに直接書くとセキュリティリスクがあります
