services:
  - type: web
    name: saraoku-db-api
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python api/api.py"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # 注意: この値はRenderダッシュボードで設定してください
        # ここに直接書くとセキュリティリスクがあります
